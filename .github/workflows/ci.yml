name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fetch the models
        # verify:build asserts they are in dist, so the build has to have them.
        run: pnpm models:fetch
      - name: Build and verify under a subpath
        # The deploy workflow builds under /<repo>/. Exercising that here means a
        # base-path regression fails on the pull request rather than on a push to
        # main, after it is too late to review.
        run: BASE_PATH=/steadyhum/ pnpm build && pnpm verify:build /steadyhum/
      - name: Build and verify at the site root
        # Last on purpose, so the job leaves dist/ in the shape anything running
        # afterwards expects. A subpath dist/ served at the root is a blank page.
        run: pnpm build && pnpm verify:build /

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Fetch the models
        # The engine test drives the real MediaPipe models; without them it
        # would pass vacuously.
        run: pnpm models:fetch
      - run: pnpm e2e
      - name: End-to-end under the Pages subpath
        # Vite's base only moves the assets. The router needs its own basename,
        # and nothing but actually driving the app under a subpath notices when
        # it is missing: every asset loads and the app renders the not-found
        # screen.
        run: pnpm e2e:subpath
